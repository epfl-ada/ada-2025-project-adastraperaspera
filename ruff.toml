# Ruff configuration for clean, consistent Python code
# This configuration aims for pragmatic strictness suitable for coursework and production.

target-version = "py311"
line-length = 100

[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort (import sorting)
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "PT",  # flake8-pytest-style
    "ANN", # flake8-annotations
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific rules
]
ignore = [
    # Allow module-level dunder names without docstrings for small scripts
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D107", # pydocstyle (if enabled via pydocstyle)
]
fixable = ["ALL"]

[lint.per-file-ignores]
"tests/**" = [
    "ANN",   # tests often don't need annotations
    "S101",  # allow asserts in tests
    "PT004", # allow multiple asserts per test function
]
"**/scripts/**" = [
    "ANN", # annotations optional in small scripts
]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[lint.isort]
known-first-party = ["src"]
combine-as-imports = true
force-sort-within-sections = true

[lint.flake8-bugbear]
extend-immutable-calls = ["attr.s", "attrs.define", "dataclasses.dataclass"]

[lint.pyupgrade]
keep-runtime-typing = false

[lint.pydocstyle]
convention = "google"

[lint.pep8-naming]
classmethod-decorators = ["classmethod"]

[lint.flake8-annotations]
allow-star-arg-any = true
ignore-fully-untyped = false
mypy-init-return = true
